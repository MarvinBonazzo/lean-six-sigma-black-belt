<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il check-in delle 15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300;0,400;0,500;0,700;0,800;1,400&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* A comic told one step at a time on a dark stage: each arrow press adds one caption, one bubble or one insight card. */
:root{color-scheme:dark;--bg:#16130f;--ink:#2b2620;--paper:#fff;--txt:#f4efe6;--txt-soft:rgba(244,239,230,.62);--acc:#2f7f76;--acc-soft:#d6eee9;--yel:#fff3a8}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{height:100%}
body{font-family:Figtree,system-ui,sans-serif;color:var(--txt);background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent}
.prog{position:fixed;left:0;right:0;bottom:0;height:5px;background:var(--acc);transform-origin:0 50%;transform:scaleX(0);transition:transform .45s ease;z-index:20}
.topbar{position:fixed;top:14px;right:14px;z-index:25}
.lang{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.lang button{font:inherit;font-size:.8rem;letter-spacing:.12em;color:var(--txt-soft);background:none;border:0;border-radius:999px;min-width:42px;min-height:32px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--txt);color:var(--bg)}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
/* screens */
#story{position:fixed;inset:0}
.scr{position:absolute;inset:0;display:grid;place-items:center;padding:58px 16px 64px;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s .45s}
.scr.on{opacity:1;visibility:visible;transition:opacity .45s ease}
.scr::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(90vmax 70vmax at 50% 42%,color-mix(in srgb,var(--glow,#3a3128) 20%,transparent),transparent 60%)}
/* beat */
.chip{position:absolute;top:16px;left:16px;right:120px;display:flex;align-items:center;gap:10px;font-size:.86rem;color:var(--txt-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip span{flex:none;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--txt);background:color-mix(in srgb,var(--acc) 70%,transparent);padding:4px 10px;border-radius:999px}
.box{position:relative;display:grid;gap:16px;width:min(1080px,100%,calc((100svh - 150px) * 1.538))}
.box.n2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);width:min(1180px,100%,calc((100svh - 150px) * 3.1))}
@media(max-aspect-ratio:1/1){.box.n2{grid-template-columns:minmax(0,1fr);width:min(100%,calc((100svh - 190px) / 2 * 1.538))}}
.panel{border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 30px 80px -24px rgba(0,0,0,.75),0 0 0 2px rgba(0,0,0,.35)}
.panel svg{display:block;width:100%;height:auto}
.narr{position:absolute;left:clamp(-44px,-3vw,-8px);bottom:clamp(-30px,-2.6vw,-16px);display:flex;align-items:flex-end;gap:4px;max-width:min(84%,560px);z-index:2;pointer-events:none}
.narr .av{flex:none;width:clamp(56px,7vw,86px);height:auto;border-radius:50%;background:var(--acc-soft);border:2.5px solid var(--ink);box-shadow:0 8px 20px -8px rgba(0,0,0,.6)}
.narr .nb{position:relative;margin:0 0 clamp(18px,2.4vw,30px) 8px;background:#fff;color:var(--ink);border:2.4px solid var(--ink);border-radius:14px;padding:6px 12px 7px;font-family:"Patrick Hand",sans-serif;font-size:clamp(1.05rem,2.2vw,1.45rem);line-height:1.2;box-shadow:3px 3px 0 var(--ink)}
.narr .nb::before{content:"";position:absolute;left:-15px;bottom:8px;border:8px solid transparent;border-right:14px solid var(--ink);border-left:0}
.narr .nb::after{content:"";position:absolute;left:-9px;bottom:10.5px;border:5.5px solid transparent;border-right:10px solid #fff;border-left:0}
@media(max-width:600px){.narr{left:-4px;bottom:auto;top:calc(100% + 10px);max-width:100%;align-items:center}.narr .nb{margin:0 0 0 8px}.narr .nb::before{bottom:auto;top:50%;margin-top:-8px}.narr .nb::after{bottom:auto;top:50%;margin-top:-5.5px}}
/* narrator: big and centred over the darkened scene, then he steps away */
.box::after{content:"";position:absolute;inset:-2px;border-radius:20px;background:rgba(12,10,8,.6);opacity:0;transition:opacity .4s ease;pointer-events:none;z-index:2}
.narr-on .box::after{opacity:1}
.narr-c{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 6%;opacity:0;visibility:hidden;transform:scale(.96);transition:opacity .35s ease,transform .4s cubic-bezier(.2,.8,.2,1),visibility 0s .4s;pointer-events:none}
.narr-on .narr-c{opacity:1;visibility:visible;transform:none;transition:opacity .35s ease,transform .4s cubic-bezier(.2,.8,.2,1)}
.narr-c .av{width:clamp(100px,21vh,190px);height:auto;border-radius:50%;background:var(--acc-soft);border:3px solid var(--ink);box-shadow:0 0 0 4px rgba(255,255,255,.14),0 14px 30px -10px rgba(0,0,0,.6)}
.narr-c .nb{position:relative;max-width:min(100%,640px);background:#fff;color:var(--ink);border:2.6px solid var(--ink);border-radius:18px;padding:clamp(12px,1.8vw,20px) clamp(16px,2.4vw,26px);font-family:"Patrick Hand",sans-serif;font-size:clamp(1.15rem,2.4vw,1.75rem);line-height:1.28;text-align:center;box-shadow:4px 4px 0 #000}
.narr-c .nb::before{content:"";position:absolute;left:calc(50% - 10px);top:-18px;border:10px solid transparent;border-bottom:17px solid var(--ink);border-top:0}
.narr-c .nb::after{content:"";position:absolute;left:calc(50% - 7px);top:-11px;border:7px solid transparent;border-bottom:13px solid #fff;border-top:0}
@media(max-width:600px){.narr-c{inset:-70px -4px;padding:0}.narr-c .av{width:76px}}
/* bubbles appear one at a time */
.panel{position:relative;container-type:inline-size}
.bub{position:absolute;margin:0;background:#fff;border:max(1.5px,.6cqw) solid var(--ink);border-radius:4cqw;padding:1.75cqw 2.75cqw 2cqw;font-family:"Patrick Hand",Figtree,sans-serif;font-size:3.875cqw;line-height:1.2;color:var(--ink);opacity:0;transform:translateY(2cqw) scale(.96);transform-origin:var(--tx) 100%;transition:opacity .3s ease,transform .35s cubic-bezier(.2,.8,.2,1.2)}
.bub.in{opacity:1;transform:none}
@media(max-width:520px){.bub{font-size:4.4cqw;line-height:1.12;padding:1.5cqw 2.2cqw 1.7cqw}}
.bub b{color:var(--acc);font-weight:400}
.bub::before{content:"";position:absolute;left:calc(var(--tx) - 2.25cqw);bottom:-3.5cqw;border:2.25cqw solid transparent;border-top:3.5cqw solid var(--ink);border-bottom:0}
.bub::after{content:"";position:absolute;left:calc(var(--tx) - 1.5cqw);bottom:-2.35cqw;border:1.5cqw solid transparent;border-top:2.5cqw solid #fff;border-bottom:0}
.bub.think{border-radius:5.5cqw;border-style:dashed}
.bub.think::before{width:2.5cqw;height:2.5cqw;border-radius:50%;border:max(1.5px,.6cqw) solid var(--ink);background:#fff;left:calc(var(--tx) - 1.5cqw);bottom:-4cqw}
.bub.think::after{width:1.5cqw;height:1.5cqw;border-radius:50%;border:max(1.2px,.5cqw) solid var(--ink);background:#fff;left:calc(var(--tx) - .25cqw);bottom:-6.75cqw}
.bub.shout{background:#fff4d6;border-width:max(2px,.75cqw)}
.plab{position:absolute;left:2.5%;top:3.8%;margin:0;background:var(--yel);border:max(1.5px,.5cqw) solid var(--ink);border-radius:1cqw;padding:.75cqw 2cqw;font-size:3cqw;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
/* insight card over the dimmed scene */
.dim{position:absolute;inset:0;background:rgba(12,10,8,.62);opacity:0;transition:opacity .4s ease;pointer-events:none;z-index:3}
.ins{position:absolute;z-index:4;right:max(16px,5vw);top:50%;width:min(420px,calc(100% - 32px));background:#fff;color:var(--ink);border-radius:16px;padding:18px 20px 20px;box-shadow:0 30px 70px -20px rgba(0,0,0,.8);opacity:0;visibility:hidden;transform:translateY(calc(-50% + 16px));transition:opacity .4s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s}
.insight .dim{opacity:1}
.insight .ins{opacity:1;visibility:visible;transform:translateY(-50%);transition:opacity .4s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.ik{display:flex;align-items:center;gap:7px;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:6px}
.ik svg{width:18px;height:18px}
.ik em{margin-left:auto;font-style:normal;font-weight:500;letter-spacing:.04em;text-transform:none;font-size:.78rem;color:#7a7064;border:1px solid #d9d2c5;border-radius:999px;padding:2px 9px}
.ins h3{font-size:1.45rem;font-weight:800;line-height:1.15;margin-bottom:8px;letter-spacing:-.01em}
.ins p:last-child{font-size:1rem;line-height:1.55;color:#4d453c}
@media(max-width:700px){.ins{right:16px;left:16px;width:auto;top:auto;bottom:74px;transform:translateY(16px)}.insight .ins{transform:none}}
/* intro */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:760px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--txt);background:color-mix(in srgb,var(--acc) 55%,transparent);padding:6px 13px 6px 10px;border-radius:999px}
.tag svg{width:16px;height:16px}
.hero h1{font-weight:800;font-size:clamp(2.4rem,7vw,4.2rem);line-height:1.02;letter-spacing:-.02em;margin:14px 0 6px}
.tl{font-style:italic;font-size:clamp(1.1rem,2.6vw,1.5rem);color:var(--txt-soft)}
.dur{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-soft)}
.dur svg{width:15px;height:15px}
.host{display:flex;align-items:center;gap:14px;margin-top:18px;text-align:left;max-width:720px}
.herofig{flex:none;width:clamp(112px,18vh,168px);height:auto;border-radius:50%;background:var(--acc-soft);border:3px solid var(--ink);box-shadow:0 0 0 4px rgba(255,255,255,.12),0 18px 30px -10px rgba(0,0,0,.6)}
.hello{position:relative;background:#fff;color:var(--ink);border:2.4px solid var(--ink);border-radius:18px;padding:12px 16px 13px;font-family:"Patrick Hand",sans-serif;font-size:clamp(1.08rem,2.1vw,1.32rem);line-height:1.28;box-shadow:4px 4px 0 #000}
.hello::before{content:"";position:absolute;left:-17px;top:38%;border:9px solid transparent;border-right:16px solid var(--ink);border-left:0}
.hello::after{content:"";position:absolute;left:-11px;top:calc(38% + 3px);border:6px solid transparent;border-right:12px solid #fff;border-left:0}
@media(max-width:600px){.host{flex-direction:column;gap:12px;text-align:left}.herofig{width:96px}.hello::before{left:calc(50% - 9px);top:-17px;border:9px solid transparent;border-bottom:16px solid var(--ink);border-top:0}.hello::after{left:calc(50% - 6px);top:-11px;border:6px solid transparent;border-bottom:12px solid #fff;border-top:0}}
.desc{font-size:clamp(.95rem,1.8vw,1.05rem);line-height:1.5;color:var(--txt-soft);max-width:56ch}
.note-y{background:var(--yel);color:var(--ink);border:2px solid var(--ink);padding:6px 11px;font-size:.92rem;line-height:1.3;max-width:220px;box-shadow:3px 3px 0 #000;transform:rotate(-.6deg)}
.note-y b{font-weight:800}
/* intro: only Marvin, big */
.host.big{display:flex;flex-direction:column;align-items:center;gap:22px;max-width:760px;margin:0 auto;text-align:center}
.host.big .herofig{width:clamp(150px,28vh,250px)}
.host.big .hello{font-size:clamp(1.25rem,2.4vw,1.75rem);line-height:1.32;padding:clamp(16px,2.2vw,24px) clamp(18px,2.6vw,30px)}
.host.big .hello::before{left:calc(50% - 10px);top:-18px;border:10px solid transparent;border-bottom:17px solid var(--ink);border-top:0}
.host.big .hello::after{left:calc(50% - 7px);top:-11px;border:7px solid transparent;border-bottom:13px solid #fff;border-top:0}
@media(max-width:600px){.host.big .herofig{width:130px}}
/* keyboard hint, always bottom right; lights up when someone tries something else */
.hint{position:fixed;right:16px;bottom:22px;z-index:21;display:grid;justify-items:end;gap:8px;pointer-events:none;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease,visibility 0s .3s}
.hint.nudge,.at-start .hint{opacity:1;visibility:visible;transform:none;transition:opacity .25s ease,transform .25s ease}
.at-start .hint:not(.nudge) .kr{animation:keyflash 1.4s ease-in-out infinite}
.kb{width:118px;height:auto;display:block;transition:transform .2s}
.hint .note-y{transform:rotate(-.6deg)}
.hint.nudge .kl,.hint.nudge .kr{animation:keyflash .5s ease-in-out 4}
.hint.nudge .kb{animation:keybump .5s ease-in-out 4}
@keyframes keyflash{50%{fill:#ffe14d}}
@keyframes keybump{50%{transform:scale(1.08)}}
@media(hover:none) and (pointer:coarse){.hint .keys{display:none}}
/* end */
.endc{display:grid;justify-items:center;text-align:center;gap:16px;max-width:620px}
.endc h2{font-weight:800;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.05;letter-spacing:-.02em}
.endc>p:not(.fine){font-size:1.12rem;line-height:1.55;color:var(--txt-soft)}
.btn{display:inline-flex;align-items:center;min-height:52px;padding:12px 24px;border-radius:999px;background:var(--acc);color:#fff;text-decoration:none;font-weight:700;font-size:1.06rem;box-shadow:0 14px 30px -12px color-mix(in srgb,var(--acc) 80%,transparent);transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.again{font:inherit;font-size:.95rem;color:var(--txt-soft);background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:40px}
.fine{font-size:.76rem;line-height:1.5;color:rgba(244,239,230,.45);max-width:60ch}
/* nav */
@media(prefers-reduced-motion:reduce){.narr-c,.narr-on .narr-c,.box::after,.scr,.scr.on,.dim,.ins,.insight .ins,.bub{transition:none}.bub{transform:none}.hint.nudge .kb{animation:none}.prog{transition:none}}
</style>
</head>
<body class="at-start">
<div class="topbar"><div class="lang" role="group" aria-label="Lingua / Language"><button type="button" data-lang="it" aria-pressed="true">IT</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div></div>
<main id="story" aria-live="polite"></main>
<div class="hint" id="hint" aria-hidden="true"></div>
<div class="prog" id="prog"></div>
<script>
// Comic engine: characters, scenes, bubbles, chapters. Story files define CAST and STORY.
const INK = '#2b2620';
const SW = 'stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"';
let LANG = 'it';
const tr = v => (v && typeof v === 'object' && ('it' in v || 'en' in v)) ? v[LANG] : (typeof v === 'function' ? v(LANG) : v);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---------- characters ----------
const ARMS = {
  down: [['M26 96 Q18 124 22 150', 22, 152], ['M74 96 Q82 124 78 150', 78, 152]],
  wave: [['M26 96 Q18 124 22 150', 22, 152], ['M74 96 Q94 86 90 58', 90, 54]],
  point: [['M26 96 Q18 124 22 150', 22, 152], ['M74 96 Q94 102 106 92', 108, 90]],
  think: [['M26 96 Q30 126 50 120', 52, 118], ['M74 96 Q84 80 63 66', 61, 64]],
  shrug: [['M26 96 Q8 112 14 86', 14, 82], ['M74 96 Q92 112 86 86', 86, 82]],
  cross: [['M26 96 Q32 124 66 114', 66, 114], ['M74 96 Q68 124 34 114', 34, 114]],
  hold: [['M26 96 Q18 124 22 150', 22, 152], ['M74 96 Q80 124 60 118', 58, 116]],
  phone: [['M26 96 Q28 124 44 114', 44, 113], ['M74 96 Q72 124 56 114', 56, 113]],
  hips: [['M26 96 Q6 116 24 130', 24, 130], ['M74 96 Q94 116 76 130', 76, 130]],
  cheer: [['M26 96 Q12 72 14 48', 14, 44], ['M74 96 Q88 72 86 48', 86, 44]],
  write: [['M26 96 Q26 126 42 120', 44, 118], ['M74 96 Q76 128 58 124', 58, 122]]
};
const PROPS = {
  cup: (x, y) => `<g transform="translate(${x - 8} ${y - 18})"><path d="M14 4 q8 0 8 7 q0 7 -8 7" fill="none" ${SW}/><rect x="0" y="0" width="15" height="19" rx="3" fill="#fff" ${SW}/><path d="M4 -5 q2 -3 0 -6 M9 -5 q2 -3 0 -6" fill="none" stroke="#b9ab98" stroke-width="1.6"/></g>`,
  phone: () => `<rect x="40" y="96" width="20" height="30" rx="4" fill="#3a3f55" ${SW}/><rect x="43" y="100" width="14" height="20" rx="2" fill="#9fc3e6"/>`,
  paper: (x, y) => `<g transform="translate(${x - 12} ${y - 30}) rotate(-6)"><rect width="24" height="30" rx="2" fill="#fff" ${SW}/><path d="M5 9 h14 M5 15 h14 M5 21 h9" stroke="#b9ab98" stroke-width="1.6"/></g>`,
  notebook: () => `<g transform="translate(36 100) rotate(-4)"><rect width="30" height="24" rx="3" fill="#f6d38a" ${SW}/><path d="M15 2 v20" stroke="${INK}" stroke-width="1.6"/></g>`,
  pen: (x, y) => `<path d="M${x} ${y} l10 -14" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`,
  suitcase: () => `<g transform="translate(88 112)"><rect x="0" y="8" width="34" height="42" rx="5" fill="#b4614a" ${SW}/><path d="M11 8 v-8 h12 v8" fill="none" ${SW}/><path d="M0 22 h34" stroke="${INK}" stroke-width="1.6"/></g>`,
  tray: (x, y) => `<g transform="translate(${x - 22} ${y - 14})"><rect x="0" y="12" width="44" height="5" rx="2" fill="#c9c2b6" ${SW}/><path d="M6 12 q6 -14 14 0 M22 12 q8 -14 16 0" fill="#e8b66a" ${SW}/></g>`
};

// Soft "3D" characters: gradient-shaded faces, big round heads, glossy eyes and hair, no heavy outlines.
let PID = 0;
const shade = (hex, a) => { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255; const t = a < 0 ? 0 : 255, p = Math.abs(a); r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p); return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1); };
function person(c, o = {}) {
  const mood = o.mood || 'neutral', pose = o.pose || 'down', sk = c.skin, hr = c.hair, sh = c.shirt, id = 'p' + (++PID);
  const S = `url(#${id}s)`, HR = `url(#${id}h)`, B = `url(#${id}b)`, soft = 'stroke="rgba(40,25,15,.16)" stroke-width="1"';
  let g = `<defs><radialGradient id="${id}s" cx="40%" cy="30%" r="78%"><stop offset="0" stop-color="${shade(sk, .3)}"/><stop offset=".55" stop-color="${sk}"/><stop offset="1" stop-color="${shade(sk, -.24)}"/></radialGradient>`
    + `<linearGradient id="${id}h" x1=".2" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="${shade(hr, .32)}"/><stop offset="1" stop-color="${shade(hr, -.3)}"/></linearGradient>`
    + `<linearGradient id="${id}b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${shade(sh, .24)}"/><stop offset="1" stop-color="${shade(sh, -.22)}"/></linearGradient></defs>`;
  // hair behind the head (head parts sit 6 units lower, close to the shoulders)
  g += '<g transform="translate(0 6)">';
  if (c.style === 'long') g += `<path d="M21 40 Q21 6 50 6 Q79 6 79 40 L82 86 Q73 94 65 86 L65 52 L35 52 L35 86 Q27 94 18 86 Z" fill="${HR}"/>`;
  if (c.style === 'bun') g += `<circle cx="50" cy="8" r="10.5" fill="${HR}"/>`;
  if (c.style === 'pony') g += `<path d="M72 24 Q98 34 88 76 Q79 60 70 44 Z" fill="${HR}"/>`;
  g += '</g>';
  // neck and body
  g += `<path d="M43 58 h14 v28 h-14z" fill="${shade(sk, -.14)}"/><ellipse cx="50" cy="64" rx="9" ry="4" fill="${shade(sk, -.3)}" opacity=".45"/>`;
  g += `<path d="M19 168 C19 108 30 84 50 84 C70 84 81 108 81 168 Z" fill="${B}" ${soft}/>`;
  if (c.outfit === 'suit') g += `<path d="M44 85 L50 98 L56 85 Z" fill="#f7f5f2"/><path d="M50 98 l-4 6 4 26 4 -26z" fill="#a8423b"/><path d="M38 86 L48 112 M62 86 L52 112" fill="none" stroke="${shade(sh, -.4)}" stroke-width="1.6"/>`;
  else if (c.outfit === 'apron') g += `<path d="M34 106 h32 v64 h-32 z" fill="#fbfaf7" ${soft}/><path d="M34 106 L42 86 M66 106 L58 86" stroke="#e9e5de" stroke-width="2.4"/>`;
  else g += `<path d="M42 85 L50 95 L58 85" fill="none" stroke="${shade(sh, -.35)}" stroke-width="1.8" stroke-linecap="round"/>`;
  if (c.badge) g += `<rect x="58" y="102" width="14" height="8" rx="2" fill="#fff" ${soft}/>`;
  // head
  g += '<g transform="translate(0 6)">';

}

let BK = 0; // running bubble number inside a scene
function bubble(b) {
  const x = b.x, y = b.y, w = b.w || 170, tx = Math.max(18, Math.min(w - 18, (b.tail != null ? b.tail : x + w / 2) - x));
  const cls = 'bub' + (b.think ? ' think' : '') + (b.shout ? ' shout' : '');
  const pc = v => (v * 100).toFixed(3) + '%';
  return `<div class="${cls}" data-k="${++BK}" style="left:${pc(x / 400)};top:${pc(y / 260)};width:${pc(w / 400)};--tx:${pc(tx / w)}">${tr(b.t)}</div>`;
}
function panel(p) {
  const sc = SC[p.scene || 'plain'];

  const chars = (p.chars || []).filter(ch => !ch.fore).map(ch => placed(ch, sc)).join('');

  const label = p.label ? `<div class="plab">${tr(p.label)}</div>` : '';

  return `<figure class="panel">${svg}${(p.bubbles || []).map(bubble).join('')}${label}</figure>`;
}

function render() {

const TOUCH = matchMedia('(hover: none) and (pointer: coarse)').matches;
function hintText(nudging) { const u = UI[LANG]; document.getElementById('hintnote').innerHTML = nudging ? (TOUCH ? u.nudgeT : u.nudgeK) : (TOUCH ? u.touch : u.keys); }
let nudgeT = 0;
function nudge() {

  hintText(true); h.classList.remove('nudge'); void h.offsetWidth; h.classList.add('nudge');
  clearTimeout(nudgeT); nudgeT = setTimeout(() => h.classList.remove('nudge'), 2600);
}
function apply() {
  const st = STEPS[CUR], all = document.querySelectorAll('.scr');
  if (st.s !== SHOWN) { all.forEach(x => { const on = +x.dataset.s === st.s; x.classList.toggle('on', on); x.setAttribute('aria-hidden', String(!on)); }); SHOWN = st.s; }
  const scr = all[st.s];
  scr.querySelectorAll('.bub[data-k]').forEach(b => b.classList.toggle('in', +b.dataset.k <= st.k));
  scr.classList.toggle('insight', !!st.ins);
  scr.classList.toggle('narr-on', !!st.narr);
  document.body.classList.toggle('at-start', CUR === 0);
  if (!document.getElementById('hint').classList.contains('nudge')) hintText(false);

}
function go(i) { i = Math.max(0, Math.min(STEPS.length - 1, i)); if (i === CUR) return; CUR = i; apply(); }
function init() {
  const h = location.hash;
  let lg = h === '#en' ? 'en' : h === '#it' ? 'it' : null;
  if (!lg) { try { lg = localStorage.getItem('comic-lang'); } catch (e) {} }
  LANG = lg === 'en' ? 'en' : 'it';
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
    LANG = b.dataset.lang; try { localStorage.setItem('comic-lang', LANG); } catch (e) {}
    try { history.replaceState(null, '', '#' + LANG); } catch (e) {}
    render();
  }));
  const jump = +new URLSearchParams(location.search).get('step'); if (jump > 0) CUR = jump;
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]'); if (g) { go(+g.dataset.go); return; }
    if (!TOUCH && !e.target.closest('button, a, .lang')) nudge();
  });
  const QUIET = ['Tab', 'Shift', 'Alt', 'Control', 'Meta', 'CapsLock', 'Escape', 'Enter'];
  addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(CUR + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(CUR - 1); }
    else if (!QUIET.includes(e.key)) { e.preventDefault(); nudge(); }
  });
  let wheelT = 0;
  addEventListener('wheel', () => { const t = Date.now(); if (t - wheelT > 900) { wheelT = t; nudge(); } }, { passive: true });
  let sx = 0, sy = 0, t0 = 0, onBtn = false;
  addEventListener('touchstart', e => { const t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; t0 = Date.now(); onBtn = !!e.target.closest('button, a, .lang'); }, { passive: true });
  addEventListener('touchend', e => {
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3 && Date.now() - t0 < 800) go(CUR + (dx < 0 ? 1 : -1));
    else if (!onBtn) nudge();
  }, { passive: true });

}
